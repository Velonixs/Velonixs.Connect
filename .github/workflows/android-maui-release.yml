name: Build Android Portal App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/Velonixs.Connect.Portal.Maui/**'
      - 'src/Velonixs.Connect.Mobile.Abstractions/**'
      - 'src/Velonixs.Connect.Portal.Components/**'
      - 'src/Velonixs.Connect.Api.Client/**'
      - '.github/workflows/android-maui-release.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android project
        run: dotnet restore src/Velonixs.Connect.Portal.Maui/Velonixs.Connect.Portal.Maui.csproj

      - name: Decode signing keystore
        shell: pwsh
        env:
          VELONIXS_ANDROID_KEYSTORE_BASE64: ${{ secrets.VELONIXS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VELONIXS_ANDROID_KEYSTORE_BASE64)) {
            throw "VELONIXS_ANDROID_KEYSTORE_BASE64 secret is required for signed Android release builds."
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "velonixs-release.keystore"
          [System.IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:VELONIXS_ANDROID_KEYSTORE_BASE64))
          "VELONIXS_ANDROID_KEYSTORE=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish signed Android App Bundle
        shell: pwsh
        env:
          VELONIXS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VELONIXS_ANDROID_KEYSTORE_PASSWORD }}
          VELONIXS_ANDROID_KEY_ALIAS: ${{ secrets.VELONIXS_ANDROID_KEY_ALIAS }}
          VELONIXS_ANDROID_KEY_PASSWORD: ${{ secrets.VELONIXS_ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish src/Velonixs.Connect.Portal.Maui/Velonixs.Connect.Portal.Maui.csproj `
            -f net10.0-android `
            -c Release `
            --no-restore

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: velonixs-portal-android-aab
          path: src/Velonixs.Connect.Portal.Maui/bin/Release/net10.0-android/**/*.aab
          if-no-files-found: error
